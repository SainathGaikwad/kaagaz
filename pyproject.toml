[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaagaz"
version = "0.1.0"
description = "From a photographed prison register page to a verified Section 479 BNSS eligibility list, with Muse Spark reading the page and a law table checking every section."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sainath Gaikwad"}]
dependencies = [
  "openai>=1.50",
  "python-dotenv>=1.0",
  "pillow>=10",
  "pypdfium2>=4.30",
  "pandas>=2.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[project.scripts]
kaagaz = "kaagaz.cli:main"

[tool.setuptools.packages.find]
include = ["kaagaz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
